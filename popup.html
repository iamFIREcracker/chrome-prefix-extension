<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <p class="hint">Press <b>1</b>–<b>8</b> or click a color.</p>
    <p class="reset-hint">Press <b>0</b> to reset.</p>
    <div id="grid" class="grid"></div>
    <p id="status" class="status"></p>
    <div class="shortcuts">
      <p class="shortcuts-title">Other shortcuts</p>
      <ul class="shortcut-list">
        <li><kbd>(</kbd> <kbd>)</kbd><span>previous / next tab</span></li>
        <li><kbd>c</kbd><span>new tab</span></li>
        <li><kbd>&amp;</kbd><span>close tab</span></li>
        <li><kbd>r</kbd><span>reload extension</span></li>
        <li><kbd>z</kbd><span>keep screen awake (toggle)</span></li>
      </ul>
    </div>
    <script src="schemes.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
